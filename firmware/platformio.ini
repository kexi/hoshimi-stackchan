[env:m5stack-cores3]
# pioarduino fork を使うのは、公式 espressif32 が CoreS3 の新しい Arduino core に
# 追随していないため (StackChan-BSP は新しい core を前提にしている)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-cores3
# StackChan-BSP の library.json は frameworks: arduino のみ。espidf は要求していない
framework = arduino
board_build.partitions = partitions.csv

# ESP32 非依存のロジックはリポジトリ直下の lib/ に置き、ホスト (CMake + ctest) と
# ファームウェアで同じソースを共有する。
# Why not lib_extra_dirs = ..: リポジトリ直下を指すと firmware/ や test/ まで
# ライブラリ候補として走査されてしまう。lib/ を直接指す。
lib_extra_dirs = ../lib

# LDF の既定 (chain) は #include を浅くしか辿らないため、M5HAL が入れ子で要求する
# Wire.h (framework 同梱) を見つけられずリンクエラーになる。deep+ で全て走査する。
lib_ldf_mode = deep+

lib_deps =
  m5stack/M5Unified@0.2.19
  m5stack/M5GFX@0.2.26
  # サーボ・RGB LED・タッチセンサ。IMU は M5Unified 側 (BMI270 + AUX の BMM150)
  https://github.com/m5stack/StackChan-BSP.git#f7ed40e6f5d9a1d08440cb926f3a0865b81882f8
  # スタックチャンの顔。描画は自前のスレッドで回るので loop() から触らない。
  # README は v0.10.0 と書いているがタグは v0.9.2 までしか無いので HEAD を留める
  https://github.com/meganetaaan/m5stack-avatar.git#7a90083edd9bbdc1a52ea13afe4d5c3b7fc7bfa8
  # framework 同梱だが LDF が自動では拾わないもの。
  # Wire/SPI は StackChan-BSP と M5HAL が、Network は WiFi が内部で要求する
  # Networking はディレクトリ名 (Network) と library.properties の name が
  # 食い違っている。lib_deps に書くときは name の方に合わせる
  Wire
  SPI
  WiFi
  Networking
  ESPmDNS
  HTTPClient
  NetworkClientSecure
  Preferences

build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I src
  # LDF は依存ライブラリのビルドに framework 同梱ライブラリの include path を
  # 伝播しないので、入れ子で要求されるものは明示的に渡す。
  # Wire: M5HAL が、Network: WiFiGeneric.h が include する
  -I $PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/Wire/src
  -I $PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/Network/src
  # Serial を USB (内蔵 JTAG/serial) へ出す。これが無いと Serial は UART0 に行き、
  # USB には何も出ない。NVS 経由で状態を読む手は使えない (フラッシュ読み出しは
  # esptool のリセットを伴うので、毎回「起動直後」しか観測できない)。
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_unflags = -std=gnu++11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
