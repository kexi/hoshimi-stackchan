# ローカルと CI で同じ flake・同じ just recipe を通す。
# ツールチェーンはすべて flake.lock で固定した nixpkgs から供給する。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチの連続 push では古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 整形漏れ (clang-format) と静的解析 (clang-tidy)
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix develop --command just fmt-check
      - run: nix develop --command just lint

  # ESP32 非依存コアのホストテスト (天体計算・方位計算・サーボマッピング)
  test-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix develop --command just test-host

  # CoreS3 ファームウェアのビルド
  build-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # platform とライブラリの取得は重いのでキャッシュする (nix store 自体はキャッシュしない)。
      # key に platformio.ini を混ぜるのは、成果物が platform / lib_deps の版に紐づくため
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - run: nix develop --command just build
