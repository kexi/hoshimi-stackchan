# hook は just recipe を呼ぶだけにして、ローカル・CI・手動実行で同じ検証を通す。
# 整形はせず検査のみ行う (hook が勝手に直すと、ステージした内容とコミットされる
# 内容がずれて、レビューしたものと違うコードが入る)
#
# nix develop 経由で呼ぶのは、hook が devshell の外 (GUI クライアントや IDE の
# コミット機能) から起動されても、ツールが PATH に無くて落ちないようにするため。
# devshell 内から実行した場合は既に環境が整っているので追加コストはほぼない。
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{cpp,hpp,h}"
      run: nix develop --command just fmt-check
    tidy:
      glob: "{.clang-tidy,CMakeLists.txt,lib/**/*.{cpp,hpp},test/**/*.cpp}"
      run: nix develop --command just lint
    actions:
      glob: ".github/workflows/*.{yml,yaml}"
      run: nix develop --command just actions
    secrets:
      run: nix develop --command just secrets-staged
